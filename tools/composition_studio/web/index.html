<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#06090d" />
    <title>Observed — Composition Studio</title>
    <style>
      :root {
        color-scheme: dark;
        background: #06090d;
        font-family: system-ui, sans-serif;
      }

      html,
      body,
      #studio-shell,
      #studio-canvas {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      #studio-shell {
        position: fixed;
        inset: 0;
        background: #06090d;
      }

      #studio-canvas {
        display: block;
        outline: none;
        /* The viewport pans and zooms itself; the browser must not also treat
           a drag as a scroll or a pinch as a page zoom. */
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }

      #loading {
        position: absolute;
        inset: 0;
        z-index: 2;
        display: grid;
        place-items: center;
        pointer-events: none;
        color: #66eaff;
        letter-spacing: 0.12em;
        background: #06090d;
        text-align: center;
        padding: 2rem;
      }

      #loading.ready {
        display: none;
      }

      #loading.failed {
        color: #ff5577;
        letter-spacing: normal;
      }
    </style>
  </head>
  <body>
    <main id="studio-shell">
      <canvas
        id="studio-canvas"
        aria-label="Observed composition studio"
      ></canvas>
      <div id="loading" role="status">READING THE CORPUS…</div>
    </main>
    <script type="module">
      const loading = document.querySelector("#loading");
      try {
        const build = "__STUDIO_BUILD__";
        const { default: init } = await import(`./composition_studio.js?v=${build}`);
        await init({
          module_or_path: new URL(
            `./composition_studio_bg.${build}.wasm`,
            import.meta.url,
          ),
        });
        loading.classList.add("ready");
      } catch (error) {
        console.error(error);
        loading.textContent = `Could not start the composition studio: ${error}`;
        loading.classList.add("failed");
      }
    </script>
  </body>
</html>
