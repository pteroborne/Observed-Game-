<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#06090d" />
    <title>Observed — Composition Studio</title>
    <style>
      :root {
        color-scheme: dark;
        background: #06090d;
        font-family: system-ui, sans-serif;
      }

      html,
      body,
      #studio-shell,
      #studio-canvas {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      #studio-shell {
        position: fixed;
        inset: 0;
        background: #06090d;
      }

      #studio-canvas {
        display: block;
        outline: none;
        /* The viewport pans and zooms itself; the browser must not also treat
           a drag as a scroll or a pinch as a page zoom. */
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }

      #loading {
        position: absolute;
        inset: 0;
        z-index: 2;
        display: grid;
        place-items: center;
        pointer-events: none;
        color: #66eaff;
        letter-spacing: 0.12em;
        background: #06090d;
        text-align: center;
        padding: 2rem;
      }

      #loading.ready {
        display: none;
      }

      #loading.failed {
        color: #ff5577;
        letter-spacing: normal;
      }

      /* An on-page console.
         A phone has no developer tools worth the name, and this page's whole
         job is to be looked at on one. Without somewhere to put them, the
         engine's own diagnostics are only readable on a desktop - which is
         exactly the machine that does not reproduce the problem. */
      #log {
        position: absolute;
        inset: auto 0 0 0;
        z-index: 3;
        max-height: 45%;
        margin: 0;
        padding: 8px 10px;
        overflow: auto;
        background: #000000d0;
        color: #9fe8ff;
        font: 11px/1.45 ui-monospace, monospace;
        white-space: pre-wrap;
        word-break: break-word;
        border-top: 1px solid #2b5a66;
      }

      #log:empty {
        display: none;
      }

      #log .err {
        color: #ff7a94;
      }
    </style>
  </head>
  <body>
    <main id="studio-shell">
      <canvas
        id="studio-canvas"
        aria-label="Observed composition studio"
      ></canvas>
      <div id="loading" role="status">READING THE CORPUS…</div>
      <pre id="log" aria-label="diagnostics"></pre>
    </main>
    <script>
      // Installed before the module below, so nothing the engine says on its
      // way up is missed. Only lines the studio itself emits are shown: Bevy is
      // chatty at INFO and the interesting ones would scroll away.
      (function mirrorConsoleToPage() {
        const log = document.querySelector("#log");
        const KEEP = /studio diagnostics|AdapterInfo|panic|error|warn/i;

        function render(args, isError) {
          // Bevy's browser logger formats with %c and passes CSS as trailing
          // arguments; strip both so the line reads as text.
          const text = args
            .filter((a) => !(typeof a === "string" && /(^|;)\s*(color|background|font-style)\s*:/.test(a)))
            .map((a) => (typeof a === "string" ? a.replaceAll("%c", "") : String(a)))
            .join(" ")
            .trim();
          if (!text || !(isError || KEEP.test(text))) return;
          const line = document.createElement("div");
          if (isError) line.className = "err";
          line.textContent = text;
          log.appendChild(line);
          log.scrollTop = log.scrollHeight;
        }

        for (const level of ["log", "info", "warn", "error"]) {
          const original = console[level];
          console[level] = function (...args) {
            original.apply(console, args);
            try {
              render(args, level === "error" || level === "warn");
            } catch {
              /* a broken logger must never take the page down */
            }
          };
        }
        addEventListener("error", (event) => render([`error: ${event.message}`], true));
        addEventListener("unhandledrejection", (event) =>
          render([`unhandled rejection: ${event.reason}`], true),
        );
      })();
    </script>
    <script type="module">
      const loading = document.querySelector("#loading");
      try {
        const build = "__STUDIO_BUILD__";
        const { default: init } = await import(`./composition_studio.js?v=${build}`);
        await init({
          module_or_path: new URL(
            `./composition_studio_bg.${build}.wasm`,
            import.meta.url,
          ),
        });
        loading.classList.add("ready");
      } catch (error) {
        console.error(error);
        loading.textContent = `Could not start the composition studio: ${error}`;
        loading.classList.add("failed");
      }
    </script>
  </body>
</html>
