[package]
name = "composition_studio"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "composition-studio"
path = "src/main.rs"

# A second binary, not a second crate: chrome, camera framing, and the style
# crate are common; only the state above them differs.
[[bin]]
name = "module-studio"
path = "src/bin/module_studio.rs"

[dependencies]
bevy = { version = "0.19", default-features = false, features = [
    "2d",
    "3d",
    "png",
    # UI rendering. 0.18's `2d`/`3d` included `ui`; 0.19's do not. Without it the
    # chrome lays out and never draws - a silent loss the compiler cannot see.
    "ui",
    "bevy_ui_widgets",
    # Bevy's tool/editor widget set: sliders, scrollbars, disclosure toggles and
    # a theme system, plus embedded Fira fonts. Aimed at editor UI rather than
    # game UI, which is exactly what this tool is. Colour still comes from
    # `observed_ui::theme` - only the widgets and typography come from here.
    "bevy_feathers",
] }
# The profile type and the solver it drives. `serde` carries the profile;
# hex_wfc is unconditional, so no `wfc` feature is needed.
observed_facility = { path = "../../crates/observed_facility", features = ["serde"] }
# Profile RON/sidecar I/O and the content-hash fold.
observed_authoring = { path = "../../crates/observed_authoring" }
observed_content = { path = "../../crates/observed_content" }
# The house RNG. A roll of the neighbour ring uses the same `SplitMix` the
# solver draws from, so a rolled combination is reproducible the same way.
observed_core = { path = "../../crates/observed_core" }
observed_hex = { path = "../../crates/observed_hex" }
# The projector: the studio must show what a match would actually build.
observed_match = { path = "../../crates/observed_match", default-features = false }
# Colours come from the production style crate, never invented locally.
observed_style = { path = "../../crates/observed_style" }
# Chrome colour - panels, controls, text tiers - so the tool and the game's
# menus are themed from one vocabulary. `observed_style` stays gameplay colour.
observed_ui = { path = "../../crates/observed_ui" }
# `ConvexRenderMesh` turns a hull point cloud into edges.
observed_traversal = { path = "../../crates/observed_traversal", default-features = false }
observed_cutaway = { path = "../../crates/observed_cutaway" }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# ghx_proc_gen still uses getrandom 0.2 through rand 0.8. Browser targets
# require its JavaScript entropy backend to be selected explicitly.
getrandom = { version = "0.2.17", features = ["js"] }
