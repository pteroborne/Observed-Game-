[package]
name = "observed_game"
version = "0.2.0"
edition = "2024"
publish = false

[[bin]]
name = "observed"
path = "src/main.rs"

[dependencies]
# The menus are UI overlays (camera-agnostic); the Match is a first-person 3D view,
# so the assembled game renders in 3D. Image, glTF, HDR, and audio features cover
# the complete drop-in asset plan.
bevy = { version = "0.19", default-features = false, features = [
    "3d",
    "png",
    "jpeg",
    "hdr",
    "bevy_gltf",
    # Bevy 0.19 turned `Scene` into a BSN trait; glTF scenes are now
    # `WorldAsset` handles spawned through `WorldAssetRoot`, which live here.
    "bevy_world_serialization",
    "bevy_audio",
    "vorbis",
    # Bloom (the neon glow for the match) lives in bevy_post_process, which `3d`
    # does not pull; DefaultPlugins wires its PostProcessPlugin when enabled.
    "bevy_post_process",
    # UI rendering. Bevy 0.18's `3d` meta-feature included `ui`; 0.19's does not,
    # so this must be named explicitly. Without it the UI API still compiles and
    # lays out - `bevy_ui_widgets` supplies the types - and simply never draws, so
    # the loss is invisible to the compiler and to every headless test.
    "ui",
    # Headless button semantics, activation events, accessibility metadata, and
    # pointer parity for the shared frontend widget foundation.
    "bevy_ui_widgets",
    # Derives serde Serialize/Deserialize on existing bevy types (KeyCode, …) so the
    # Settings resource (Phase 48) can serialize keybindings without inventing a
    # parallel key-name enum. An in-tree feature flip on the existing dependency, not
    # a new third-party crate.
    "serialize",
] }
observed_core = { path = "../crates/observed_core" }
observed_content = { path = "../crates/observed_content" }
observed_diagnostics = { path = "../crates/observed_diagnostics" }
observed_style = { path = "../crates/observed_style" }
# Shared focusable menu chrome, extracted from this crate in Arc R.
observed_ui = { path = "../crates/observed_ui" }
observed_assets = { path = "../crates/observed_assets" }
player_input = { path = "../crates/player_input" }
observed_progression = { path = "../crates/observed_progression" }
observed_net = { path = "../crates/observed_net" }
observed_server = { path = "../server" }
observed_observation = { path = "../crates/observed_observation" }
observed_facility = { path = "../crates/observed_facility", features = ["wfc"] }
observed_hex = { path = "../crates/observed_hex" }
observed_authoring = { path = "../crates/observed_authoring" }
observed_match = { path = "../crates/observed_match" }
observed_traversal = { path = "../crates/observed_traversal" }
# Pathfinding, taken directly rather than through `vleue_navigator`.
#
# The wrapper is a Bevy plugin pinned to one engine line (0.15.0 declares
# `bevy ^0.18`), and this crate only ever used two of its functions, both
# thin covers over `polyanya`. Depending on `polyanya` directly removes an
# engine-version lock from the bot's routing.
polyanya = "0.16"
# ...at the cost of a second `glam`: `polyanya::Coords` has private fields
# and its only constructor is `From<Vec2>` on *its* glam, which is 0.30
# while Bevy 0.19 is on 0.32. Every conversion is confined to
# `src/navmesh.rs`; nothing else in the game sees this type. Drop this the
# moment `polyanya` moves to 0.32.
nav_glam = { package = "glam", version = "0.30" }
# Bevy 0.19 line.
bevy_sprite3d = { version = "=9.0.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["png"] }
rapier3d = { version = "0.34", features = ["enhanced-determinism"] }


