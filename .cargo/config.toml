[build]
# One absolute cache shared by the primary checkout and sibling worktrees.
target-dir = "O:/Observed 2/target"

[target.x86_64-pc-windows-msvc]
# Rust ships rust-lld with this toolchain; it is substantially faster than the
# default MSVC linker for Bevy's large dependency graph.
linker = "rust-lld.exe"

[target.x86_64-unknown-linux-gnu]
# mold links Bevy's large dependency graph much faster than GNU ld. Target
# tables only apply to a matching host, so this is inert on Windows - but it
# applies to *every* Linux host, CI runners included, and a machine without
# mold fails at the link step with `collect2: cannot find 'ld'` rather than
# quietly falling back. Both workflows install it; a new Linux environment
# must too.
#
# mold writes its output with mmap(MAP_SHARED), which the ntfs3 driver does not
# support - so on Linux the build directory must sit on a native filesystem
# rather than the NTFS mount this repo lives on. `target-dir` above is a
# Windows path and is deliberately left alone; override it per-machine with
# CARGO_TARGET_DIR instead of committing a second OS-specific path here.
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[alias]
# Dynamic Bevy linking is a development-only optimization. Keeping it behind
# aliases avoids accidentally shipping a binary that requires bevy_dylib.
dev-run = "run --features bevy/dynamic_linking"
dev-test = "test --workspace --features bevy/dynamic_linking"
dev-clippy = "clippy --workspace --all-targets --features bevy/dynamic_linking -- -D warnings"
