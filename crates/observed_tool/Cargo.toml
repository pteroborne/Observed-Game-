[package]
name = "observed_tool"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# Math, transforms and meshes only: the designs are data and pure poses, drawn by
# whoever uses them.
bevy = { version = "0.19", default-features = false }
# The shapes and their meshes are the Guardians' own, so the tool and the things it
# answers are built from one kit.
observed_guardian = { path = "../observed_guardian" }
