[package]
name = "observer_form_lab"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
bevy = { version = "0.19", default-features = false, features = [
    "3d",
    "ui",
    "default_font",
    "png",
] }
# The eye itself, shared with the game.
observed_observer = { path = "../../crates/observed_observer" }
# The major Guardian, stood beside the eyes for scale and contrast.
observed_guardian = { path = "../../crates/observed_guardian" }
# Colours come from the production style crate, never invented locally.
observed_style = { path = "../../crates/observed_style" }

[[bin]]
name = "observer_form_lab"
path = "src/main.rs"
