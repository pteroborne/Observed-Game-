[package]
name = "architect_lab"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "architect_lab"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:bevy", "dep:observed_ui", "dep:observed_authoring", "dep:observed_cutaway", "dep:observed_traversal"]
web = ["dep:wasm-bindgen", "dep:serde_json"]

[dependencies]
observed_match = { path = "../../crates/observed_match", default-features = false }
bevy = { version = "0.19", optional = true, default-features = false, features = [
    "2d",
    "3d",
    "ui",
    "bevy_ui_widgets",
    "default_font",
    "png",
] }
observed_content = { path = "../../crates/observed_content" }
observed_facility = { path = "../../crates/observed_facility", default-features = false }
observed_hex = { path = "../../crates/observed_hex" }
observed_style = { path = "../../crates/observed_style" }
observed_ui = { path = "../../crates/observed_ui", optional = true }
wasm-bindgen = { version = "0.2.125", optional = true }
serde_json = { version = "1", optional = true }

observed_authoring = { path = "../../crates/observed_authoring", optional = true }
observed_cutaway = { path = "../../crates/observed_cutaway", optional = true }
observed_traversal = { path = "../../crates/observed_traversal", optional = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
# The shared match crate brings in the facility solver's rand dependency.
# Browser entropy support is platform plumbing; simulation PRNGs stay seeded.
getrandom = { version = "0.2", features = ["js"] }
