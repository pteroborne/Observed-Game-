[package]
name = "plumb_lab"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
glam = "0.32"
bevy = { version = "0.19", default-features = false, features = ["ui", "3d", "png"] }
observed_style = { path = "../../crates/observed_style" }
observed_traversal = { path = "../../crates/observed_traversal" }
rapier3d = { version = "0.34", features = ["enhanced-determinism"] }
# The Rapier adapter and the Guardian rig are both already proven next door.
kinetic_lab = { path = "../kinetic_lab" }

[[bin]]
name = "plumb_lab"
path = "src/main.rs"
