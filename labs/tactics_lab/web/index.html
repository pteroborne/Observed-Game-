<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#06090d" />
    <title>Observed — Tactical Lab</title>
    <style>
      :root {
        color-scheme: dark;
        background: #06090d;
        font-family: system-ui, sans-serif;
      }

      html,
      body,
      #tactics-shell,
      #tactics-canvas {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      #tactics-shell {
        position: fixed;
        inset: 0;
        background: #06090d;
      }

      #tactics-canvas {
        display: block;
        outline: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }

      #loading {
        position: absolute;
        inset: 0;
        z-index: 2;
        display: grid;
        place-items: center;
        pointer-events: none;
        color: #ff9e33;
        letter-spacing: 0.12em;
        background: #06090d;
      }

      #loading.ready {
        display: none;
      }

      #loading.failed {
        padding: 2rem;
        color: #ff5577;
        letter-spacing: normal;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main id="tactics-shell">
      <canvas id="tactics-canvas" aria-label="Observed tactical map"></canvas>
      <div id="loading" role="status">BAKING THE FACILITY…</div>
    </main>
    <script type="module">
      const loading = document.querySelector("#loading");
      try {
        const build = "__TACTICS_BUILD__";
        const { default: init } = await import(`./tactics_lab.js?v=${build}`);
        await init({
          module_or_path: new URL(
            `./tactics_lab_bg.${build}.wasm`,
            import.meta.url,
          ),
        });
        loading.classList.add("ready");
      } catch (error) {
        console.error(error);
        loading.textContent = `Could not start the tactical lab: ${error}`;
        loading.classList.add("failed");
      }
    </script>
  </body>
</html>
