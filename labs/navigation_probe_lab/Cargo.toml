[package]
name = "navigation_probe_lab"
version = "0.1.0"
edition = "2024"
publish = false

# Phase A8 of the Bevy asset-integration roadmap.
#
# `polyanya` is depended on directly, not through `vleue_navigator`.
#
# The wrapper is a Bevy plugin and pins one engine line at a time (0.15.0
# declares `bevy ^0.18.0`), which made a pure-CPU geometry lab a blocker on
# every engine upgrade. This lab never used the plugin: it consumed
# `NavMesh::from_edge_and_obstacles` + `NavMesh::path`, both thin covers over
# `polyanya::Triangulation` and `polyanya::Mesh`. Depending on `polyanya`
# directly is the same stance the lab always documented - consume the data
# model, not the part that fights the architecture - and `polyanya` needs only
# `glam`, which the workspace already shares with Bevy.
[dependencies]
bevy = { version = "0.19", default-features = false, features = [
    "ui","2d", "png"] }
polyanya = "0.16"
observed_core = { path = "../../crates/observed_core" }
observed_style = { path = "../../crates/observed_style" }
