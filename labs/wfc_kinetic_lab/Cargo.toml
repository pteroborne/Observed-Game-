[package]
name = "wfc_kinetic_lab"
version = "0.1.0"
edition = "2024"
publish = false

default-run = "wfc_kinetic_lab"

[dependencies]
glam = "0.32"
bevy = { version = "0.19", default-features = false, features = [
    "ui",
    "3d",
    "png",
    "bevy_audio",
    "vorbis",
] }
# The solver, the tile catalog, and the geometry projection that turns one into
# the other. This lab exists to put the kinetic tool inside their output.
observed_authoring = { path = "../../crates/observed_authoring" }
observed_content = { path = "../../crates/observed_content" }
observed_facility = { path = "../../crates/observed_facility" }
observed_hex = { path = "../../crates/observed_hex" }
observed_match = { path = "../../crates/observed_match", default-features = false }
observed_style = { path = "../../crates/observed_style" }
observed_traversal = { path = "../../crates/observed_traversal" }
player_input = { path = "../../crates/player_input" }
rapier3d = { version = "0.34", features = ["enhanced-determinism"] }
# Raw Rapier stepping, the deterministic stable-ID ray, and the minor's walk
# query are already proven next door. Reuse them rather than keeping a second
# copy of the same fixed-tick physics adapter in sync.
kinetic_lab = { path = "../kinetic_lab" }

[[bin]]
name = "wfc_kinetic_lab"
path = "src/main.rs"
