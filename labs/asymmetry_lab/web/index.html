<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#06090d" />
    <title>Observed — Asymmetry Lab</title>
    <style>
      :root { color-scheme: dark; background: #06090d; font-family: system-ui, sans-serif; }
      html, body, #asymmetry-shell, #asymmetry-canvas {
        width: 100%; height: 100%; margin: 0; overflow: hidden;
      }
      #asymmetry-shell { position: fixed; inset: 0; background: #06090d; }
      #asymmetry-canvas {
        display: block; outline: none;
        /* The board owns every gesture; without this a tap-to-move reads as a scroll. */
        touch-action: none; -webkit-user-select: none; user-select: none;
      }
      #loading {
        position: absolute; inset: 0; z-index: 2; display: grid; place-items: center;
        pointer-events: none; color: #ff9e33; letter-spacing: 0.12em; background: #06090d;
      }
      #loading.ready { display: none; }
      #loading.failed { padding: 2rem; color: #ff5577; letter-spacing: normal; text-align: center; }
    </style>
  </head>
  <body>
    <main id="asymmetry-shell">
      <canvas id="asymmetry-canvas" aria-label="Observed asymmetry lab"></canvas>
      <div id="loading" role="status">TAKING YOUR SEAT…</div>
    </main>
    <script type="module">
      const loading = document.querySelector("#loading");
      try {
        const build = "__ASYMMETRY_BUILD__";
        const { default: init } = await import(`./asymmetry_lab.js?v=${build}`);
        await init({
          module_or_path: new URL(`./asymmetry_lab_bg.${build}.wasm`, import.meta.url),
        });
        loading.classList.add("ready");
      } catch (error) {
        console.error(error);
        loading.textContent = `Could not start the asymmetry lab: ${error}`;
        loading.classList.add("failed");
      }
    </script>
  </body>
</html>
