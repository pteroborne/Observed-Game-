[package]
name = "asymmetry_lab"
version = "0.1.0"
edition = "2024"
publish = false

# Two seats, two screens, one match.
#
# The architect sees the whole lattice and holds a hand of tiles. The operator
# sees only what its squad has looked at, and remembers it wrong when the
# architect rebuilds behind them. Neither can do the other's job.
[dependencies]
observed_hex = { path = "../../crates/observed_hex" }
observed_mechanics = { path = "../../crates/observed_mechanics" }
observed_style = { path = "../../crates/observed_style" }
bevy = { version = "0.19", default-features = false, features = [
    "2d",
    "ui",
    "bevy_ui_widgets",
    "default_font",
    "webgl2",
] }
usvg = { version = "0.45", default-features = false }
resvg = { version = "0.45", default-features = false }
tiny-skia = "0.11"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Each seat opens its own URL, which is how two devices join one match:
# `?seat=architect` and `?seat=operator` against the same relay.
web-sys = { version = "0.3", features = ["Window", "Location"] }
