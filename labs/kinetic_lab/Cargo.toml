[package]
name = "kinetic_lab"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# "2d" drives the schematic view, "3d" the first-person view. Both read the same
# model; neither owns a rule.
bevy = { version = "0.19", default-features = false, features = [
    "ui",
    "2d",
    "3d",
    "png",
    # Firing a tool that makes no sound is the single biggest missing piece of
    # feedback. The cues are the repo's own CC0 one-shots.
    "bevy_audio",
    "vorbis",
] }
observed_core = { path = "../../crates/observed_core" }
# The audio slot table. These `.ogg` files are CC0 and generated in-repo by
# `tools/generate_audio.py` from no external source material, so using them as
# placeholders needs no third-party licence and nothing downloaded.
observed_assets = { path = "../../crates/observed_assets" }
# The real hex WFC solver. The siege facility is a solved `HexWfcWorld` at a
# pinned seed rather than an authored rectangle, so the lab's walls, doorways and
# void are the ones the production solver actually produces.
observed_facility = { path = "../../crates/observed_facility" }
observed_hex = { path = "../../crates/observed_hex" }
# The deterministic fixed-tick character controller. Already pure, already
# stepped at FIXED_DT, so embodiment introduces no new nondeterminism.
observed_traversal = { path = "../../crates/observed_traversal" }
player_input = { path = "../../crates/player_input" }

[[bin]]
name = "kinetic_lab"
path = "src/main.rs"

[[bin]]
name = "kinetic_fps"
path = "src/bin/fps.rs"
