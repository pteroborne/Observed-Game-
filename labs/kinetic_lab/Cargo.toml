[package]
name = "kinetic_lab"
version = "0.1.0"
edition = "2024"
publish = false

default-run = "kinetic_lab"

[dependencies]
glam = "0.32"
bevy = { version = "0.19", default-features = false, features = ["ui", "3d", "png", "bevy_audio", "vorbis"] }
observed_traversal = { path = "../../crates/observed_traversal" }
observed_style = { path = "../../crates/observed_style" }
player_input = { path = "../../crates/player_input" }
rapier3d = { version = "0.34", features = ["enhanced-determinism"] }

[[bin]]
name = "kinetic_lab"
path = "src/main.rs"

[[bin]]
name = "kinetic_fps"
path = "src/bin/fps.rs"
