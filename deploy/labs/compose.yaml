name: observed-labs

services:
  observed-labs:
    image: ${LAB_IMAGE:-ghcr.io/pteroborne/observed-labs:edge}
    restart: unless-stopped
    init: true
    ports:
      - "${LAB_BIND_ADDRESS:-0.0.0.0}:${LAB_HTTP_PORT:-8086}:8080"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    labels:
      io.portainer.accesscontrol.public: "false"
      observed.component: "browser-labs"
